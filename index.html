<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMDA DLMS 2x4 + RTA PRO - PWA</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#00e5ff"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{--bg:#080c11;--card:#121a24;--line:#1f2d3d;--accent:#00e5ff;--green:#00ff88;--red:#ff3b30}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:var(--bg);color:#cbd5e1}header{background:#0e1722;border-bottom:2px solid var(--accent);padding:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:10}header h1{font-size:13px;color:#fff}.btn{border:1px solid var(--line);background:var(--card);color:#fff;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:800}.btn.on{background:var(--accent);color:#000}.btn.rta.on{background:var(--green);color:#000}.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.badge{font-size:8px;padding:2px 6px;border-radius:10px;border:1px solid var(--line);background:#0b121a}.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row label{font-size:10px;width:48px;color:#7a90a8}.row input{flex:1;accent-color:var(--accent)}.val{font-size:10px;width:58px;text-align:right;color:#fff}select{background:#0a121b;border:1px solid var(--line);color:#fff;border-radius:6px;padding:3px;font-size:10px}canvas{width:100%;background:#0a121b;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}canvas.small{height:110px}canvas.rta{height:200px;border:2px solid var(--green)}.mute{font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}.mute.off{background:#1a2736;color:#5a718a}.mute.muted{background:var(--red);color:#fff}.peq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.peq-item{background:#0a121b;border:1px solid var(--line);border-radius:8px;padding:6px}.peq-item b{font-size:9px;color:var(--accent);display:block}.peq-item input{width:100%;accent-color:var(--accent)}.master{margin:10px;border:2px solid var(--accent)}.rta-box{margin:10px;border:2px solid var(--green);background:#0a1611}</style></head><body><header><h1>AMDA AUDIO <b style="color:#00e5ff">DLMS 2x4</b> + <b style="color:#00ff88">RTA</b> PRO <span style="font-size:8px;border:1px solid #00ff88;color:#00ff88;padding:2px 5px;border-radius:10px">OFFLINE READY</span></h1><div style="display:flex;gap:6px"><button class="btn rta on" id="bRTA">RTA ON</button><button class="btn" id="bNoise">PINK NOISE</button><button class="btn" id="bStart">START AUDIO</button></div></header><div class="card rta-box"><h2>RTA 31 BAND - 20Hz-20kHz <span><span class="badge" id="rtaDb">-dB</span> <span class="badge" id="rtaPeak">PEAK: --- Hz</span></span></h2><canvas class="rta" id="cvRTA"></canvas><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><select id="rtaInput"><option value="mic">INPUT: MIC</option><option value="mix">INPUT: MIX ALL</option></select><button class="btn" id="bHold">HOLD</button><button class="btn" id="bReset">RESET PEAK</button></div></div><div class="card master"><h2>INPUT A/B - MASTER GAIN</h2><div class="row"><label>GAIN A</label><input type="range" id="gA" min="-40" max="12" value="0" step="0.5"><div class="val" id="vGA">0 dB</div></div><div class="row"><label>GAIN B</label><input type="range" id="gB" min="-40" max="12" value="0" step="0.5"><div class="val" id="vGB">0 dB</div></div></div><div class="grid" id="outs"></div><script>
const OUTS=[{id:1,name:'OUT1 SUB',col:'#ffcc00',hpf:35,lpf:110},{id:2,name:'OUT2 LOW',col:'#00ff88',hpf:110,lpf:600},{id:3,name:'OUT3 MID',col:'#00e5ff',hpf:600,lpf:3800},{id:4,name:'OUT4 HIGH',col:'#ff3b82',hpf:3800,lpf:18000}];let ctx,masterA,masterB,noiseNode,isNoise=false,outs=[],analyser,analyserData,rtaActive=true,rtaHold=false,rtaPeakHold=new Array(31).fill(-100);
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();masterA=ctx.createGain();masterB=ctx.createGain();analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0.7;analyserData=new Uint8Array(analyser.frequencyBinCount);
OUTS.forEach((o,i)=>{const inG=ctx.createGain();const hpf1=ctx.createBiquadFilter();hpf1.type='highpass';hpf1.frequency.value=o.hpf;const hpf2=ctx.createBiquadFilter();hpf2.type='highpass';hpf2.frequency.value=o.hpf;const lpf1=ctx.createBiquadFilter();lpf1.type='lowpass';lpf1.frequency.value=o.lpf;const lpf2=ctx.createBiquadFilter();lpf2.type='lowpass';lpf2.frequency.value=o.lpf;const peqs=[];for(let f of[80,250,800,1600,4000,8000]){const b=ctx.createBiquadFilter();b.type='peaking';b.frequency.value=f;b.Q.value=1.2;b.gain.value=0;peqs.push(b);}const delay=ctx.createDelay(1);const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-12;const outG=ctx.createGain();const pan=ctx.createStereoPanner();pan.pan.value=(i%2==0?-0.6:0.6);let last=inG;last.connect(hpf1);last=hpf1;last.connect(hpf2);last=hpf2;last.connect(lpf1);last=lpf1;last.connect(lpf2);last=lpf2;peqs.forEach(p=>{last.connect(p);last=p;});last.connect(delay);last=delay;last.connect(limiter);last=limiter;last.connect(outG);outG.connect(pan);pan.connect(ctx.destination);outG.connect(analyser);outs[i]={...o,inG,hpf1,hpf2,lpf1,lpf2,peqs,delay,limiter,outG,pan,muted:false,polarity:1};});masterA.connect(outs[0].inG);masterA.connect(outs[1].inG);masterA.connect(outs[2].inG);masterA.connect(outs[3].inG);masterB.connect(outs[0].inG);masterB.connect(outs[1].inG);masterB.connect(outs[2].inG);masterB.connect(outs[3].inG);}
function pinkProc(){const size=4096;const node=ctx.createScriptProcessor(size,1,1);let b0,b1,b2,b3,b4,b5,b6;b0=b1=b2=b3=b4=b5=b6=0;node.onaudioprocess=e=>{const out=e.outputBuffer.getChannelData(0);for(let i=0;i<size;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.1538;b3=0.8665*b3+w*0.3104;b4=0.55*b4+w*0.5329;b5=-0.7616*b5-w*0.01689;out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.1159;}};return node;}
document.getElementById('bStart').onclick=async()=>{init();if(ctx.state==='suspended')await ctx.resume();try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const micSource=ctx.createMediaStreamSource(s);micSource.connect(masterA);micSource.connect(masterB);micSource.connect(analyser);document.getElementById('bStart').textContent='MIC ON';document.getElementById('bStart').classList.add('on');}catch(e){alert('Mic gagal');}};
document.getElementById('bNoise').onclick=()=>{init();if(!isNoise){noiseNode=pinkProc();noiseNode.connect(masterA);noiseNode.connect(masterB);noiseNode.connect(analyser);isNoise=true;document.getElementById('bNoise').classList.add('on');document.getElementById('bNoise').textContent='NOISE ON';}else{noiseNode.disconnect();isNoise=false;document.getElementById('bNoise').classList.remove('on');document.getElementById('bNoise').textContent='PINK NOISE';}};
document.getElementById('bRTA').onclick=()=>{rtaActive=!rtaActive;const b=document.getElementById('bRTA');b.classList.toggle('on',rtaActive);b.textContent=rtaActive?'RTA ON':'RTA OFF';};
document.getElementById('bHold').onclick=()=>{rtaHold=!rtaHold;document.getElementById('bHold').textContent=rtaHold?'HOLD ON':'HOLD';};
document.getElementById('bReset').onclick=()=>{rtaPeakHold=new Array(31).fill(-100);};
const container=document.getElementById('outs');OUTS.forEach(o=>{container.innerHTML+=`<div class="card" style="border-left:4px solid ${o.col}" id="card${o.id}"><h2>${o.name}</h2><canvas class="small" id="cv${o.id}"></canvas><div class="row"><label>HPF</label><input type="range" id="hpf${o.id}" min="20" max="1000" value="${o.hpf}"><div class="val" id="vh${o.id}">${o.hpf}Hz</div></div><div class="row"><label>LPF</label><input type="range" id="lpf${o.id}" min="500" max="19000" value="${o.lpf}" step="50"><div class="val" id="vl${o.id}">${o.lpf}Hz</div></div><div class="peq-grid" id="peq${o.id}"></div><div class="row"><label>DELAY</label><input type="range" id="dl${o.id}" min="0" max="50" value="0" step="0.1"><div class="val" id="vd${o.id}">0 ms</div></div><div class="row"><label>GAIN</label><input type="range" id="g${o.id}" min="-40" max="12" value="0" step="0.5"><div class="val" id="vg${o.id}">0 dB</div><button class="mute off" id="m${o.id}">MUTE</button><button class="mute off" id="p${o.id}">Ø</button></div></div>`;});
setTimeout(()=>{OUTS.forEach(o=>{const $=id=>document.getElementById(id);const freqs=[80,250,800,1600,4000,8000];let html='';freqs.forEach((f,idx)=>{html+=`<div class="peq-item"><b>${f>=1000?f/1000+'k':f}</b><input type="range" id="peq${o.id}_${idx}" min="-12" max="12" value="0" step="0.5"><div style="font-size:8px;text-align:center" id="vpeq${o.id}_${idx}">0dB</div></div>`;});$(`peq${o.id}`).innerHTML=html;freqs.forEach((f,idx)=>{$(`peq${o.id}_${idx}`).oninput=e=>{outs[o.id-1].peqs[idx].gain.value=+e.target.value;$(`vpeq${o.id}_${idx}`).textContent=e.target.value+'dB';};});$(`hpf${o.id}`).oninput=e=>{outs[o.id-1].hpf1.frequency.value=+e.target.value;outs[o.id-1].hpf2.frequency.value=+e.target.value;$(`vh${o.id}`).textContent=e.target.value+'Hz';};$(`lpf${o.id}`).oninput=e=>{outs[o.id-1].lpf1.frequency.value=+e.target.value;outs[o.id-1].lpf2.frequency.value=+e.target.value;$(`vl${o.id}`).textContent=e.target.value+'Hz';};$(`dl${o.id}`).oninput=e=>{outs[o.id-1].delay.delayTime.value=+e.target.value/1000;$(`vd${o.id}`).textContent=e.target.value+' ms';};$(`g${o.id}`).oninput=e=>{const v=+e.target.value;const lin=Math.pow(10,v/20);const n=outs[o.id-1];n.outG.gain.value=n.muted?0:lin*n.polarity;$(`vg${o.id}`).textContent=v+' dB';};$(`m${o.id}`).onclick=()=>{const n=outs[o.id-1];n.muted=!n.muted;const b=$(`m${o.id}`);if(n.muted){b.textContent='MUTED';b.className='mute muted';n.outG.gain.value=0;}else{b.textContent='MUTE';b.className='mute off';const v=parseFloat($(`g${o.id}`).value);n.outG.gain.value=Math.pow(10,v/20)*n.polarity;}};$(`p${o.id}`).onclick=()=>{const n=outs[o.id-1];n.polarity*=-1;};});$('gA').oninput=e=>{const v=+e.target.value;$('vGA').textContent=v+' dB';if(masterA)masterA.gain.value=Math.pow(10,v/20);};$('gB').oninput=e=>{const v=+e.target.value;$('vGB').textContent=v+' dB';if(masterB)masterB.gain.value=Math.pow(10,v/20);};},300);
const bands=[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
function drawRTA(){const cv=document.getElementById('cvRTA');if(!cv||!analyser||!rtaActive)return;const c=cv.getContext('2d');const W=cv.width=cv.clientWidth*2,H=cv.height=200*2;c.clearRect(0,0,W,H);if(!rtaHold)analyser.getByteFrequencyData(analyserData);let maxVal=0,maxIdx=0;const barW=W/bands.length*0.75;bands.forEach((freq,i)=>{const bin=Math.round(freq/ctx.sampleRate*analyser.fftSize);const v=analyserData[Math.min(bin,analyserData.length-1)]||0;if(v>maxVal){maxVal=v;maxIdx=i;}const h=(v/255)*H*0.9;const x=i*W/bands.length+barW*0.1;const grad=c.createLinearGradient(0,H-h,0,H);if(v>220){grad.addColorStop(0,'#ff3b30');grad.addColorStop(1,'#ffcc00');}else if(v>180){grad.addColorStop(0,'#ffcc00');grad.addColorStop(1,'#00ff88');}else{grad.addColorStop(0,'#00e5ff');grad.addColorStop(1,'#004455');}c.fillStyle=grad;c.fillRect(x,H-h,barW,h);});document.getElementById('rtaDb').textContent=Math.round(maxVal/255*80-80)+' dB';document.getElementById('rtaPeak').textContent='PEAK: '+bands[maxIdx]+' Hz';}
function drawOut(id){const cv=document.getElementById(`cv${id}`);if(!cv)return;const c=cv.getContext('2d');const W=cv.width=cv.clientWidth*2,H=cv.height=110*2;c.clearRect(0,0,W,H);const n=outs[id-1];if(!n)return;c.strokeStyle='#162334';for(let i=1;i<5;i++){c.beginPath();c.moveTo(0,H*i/5);c.lineTo(W,H*i/5);c.stroke();}c.strokeStyle=OUTS[id-1].col;c.lineWidth=3;c.beginPath();for(let x=0;x<W;x++){const freq=20*Math.pow(1000,x/W);let hf=n.hpf1.frequency.value,lf=n.lpf1.frequency.value;let hAtt=1/(1+Math.pow(hf/freq,4)),lAtt=1/(1+Math.pow(freq/lf,4));let g=hAtt*lAtt;let db=20*Math.log10(g+0.00001);n.peqs.forEach(p=>{const df=Math.log10(freq/p.frequency.value);db+=p.gain.value*Math.exp(-(df*df)*5);});const y=H/2-db*2.5;if(x==0)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();}setInterval(()=>{OUTS.forEach(o=>drawOut(o.id));drawRTA();},80);
</script><script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>console.log('AMDA DLMS VIRTUAL'));
}
</script></body></html>
